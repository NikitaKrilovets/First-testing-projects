<app-heared></app-heared>
<app-main></app-main>
<app-footer></app-footer>

<br>


<h1>Add product</h1>

<input
    type="text"
    placeholder="Name product"
    [(ngModel)] = "newName">

<br><br>

<input
    type="number"
    placeholder="Price"
    [(ngModel)] = "newPrice">

<br><br>

<input
    type="number"
    placeholder="Quantity"
    [(ngModel)] = "newQuantity">

<br><br>

<button (click)="addProduct()">Add product</button>


<h1>Product list</h1>

@for (product of products(); track product.id) {
    <div>
        <h3>{{product.name}}</h3>
        <p>Age: {{product.price}} </p>
        <p>Quantity: {{product.quantity}}</p>
        <button (click)="removeProduct(product.id)">Remove product</button>
    </div>
}
